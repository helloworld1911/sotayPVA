const LANGS={"en-US":"Tiếng Anh (Mỹ)","en-GB":"Tiếng Anh (Anh)","ko-KR":"Tiếng Hàn","ja-JP":"Tiếng Nhật","zh-CN":"Tiếng Trung","fr-FR":"Tiếng Pháp"};
const langName=l=>(LANGS[l]||"Tiếng Anh").replace(/\s*\(.*\)/,"");
const phonOf=l=>!l||l.startsWith("en")?`phiên âm IPA ${l==="en-GB"?"giọng Anh":"giọng Mỹ"}, dạng /.../`:l==="ko-KR"?"phiên âm Latin (Revised Romanization)":l==="ja-JP"?"cách đọc hiragana và romaji":l==="zh-CN"?"pinyin có dấu thanh":"phiên âm IPA, dạng /.../";
const canSpeak=typeof window.speechSynthesis!=="undefined"&&typeof window.SpeechSynthesisUtterance!=="undefined";
const VTPL=`stakeholder /ˈsteɪkˌhoʊldər/ - (n) bên liên quan
deliverable - (n) sản phẩm bàn giao
milestone : (n) cột mốc quan trọng
escalate	(v) báo cáo lên cấp trên`;
function speak(text,lang){if(!canSpeak||!text)return;try{speechSynthesis.cancel();const L=lang||"en-US";const u=new SpeechSynthesisUtterance(String(text).replace(/\(.*?\)|\/.*?\//g," "));u.lang=L;u.rate=.92;
  const vs=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.replace("_","-").toLowerCase().startsWith(L.slice(0,2).toLowerCase()));const pref=vs.find(v=>v.lang.replace("_","-")===L)||vs[0];if(pref)u.voice=pref;speechSynthesis.speak(u)}catch(e){}}
function selDeck(){const r=route();return r.t==="deck"?S.decks.find(d=>d.id===r.id):null}
const lvl=c=>{const b=c.box||0;return b===0?"new":b>=4?"known":"learning"};
function dStats(d){const cs=d.cards||[],now=Date.now();let n=0,l=0,k=0,due=0,star=0;for(const c of cs){const v=lvl(c);if(v==="new")n++;else if(v==="known")k++;else l++;if((c.box||0)>0&&(c.due||0)<=now)due++;if(c.s)star++}return{total:cs.length,new:n,learning:l,known:k,due,star}}
function grade(c,ok){const now=Date.now();c.box=ok?Math.min(5,(c.box||0)+1):1;c.due=ok?now+INTERVAL[c.box]:now;c.seen=(c.seen||0)+1;if(ok)c.right=(c.right||0)+1}
function ansNorm(s){return String(s||"").toLowerCase().normalize("NFKC").replace(/\(.*?\)|\[.*?\]/g," ").replace(/[.,!?;:"'“”‘’…]/g,"").replace(/\s+/g," ").trim()}
function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function checkAns(given,expected){const g=ansNorm(given);if(!g)return false;
  const all=[ansNorm(expected),...String(expected||"").split(/[\/;,]| or | hoặc /).map(ansNorm)].filter(Boolean);
  const gv=[g,g.replace(/^to /,"")];
  for(const e of all){const v=[e,e.replace(/^to /,""),e.replace(/^(a|an|the) /,"")];if(gv.some(x=>v.includes(x)))return "ok"}
  for(const e of all){if(e.length>=5&&lev(g,e)<=1)return "close";if(e.length>=10&&lev(g,e)<=2)return "close"}
  return false}

/* progress saving: one write at a time per deck */
const dsave={};
function vSaveSoon(d){if(!S.canWrite)return;const st=dsave[d.id]||(dsave[d.id]={t:null,busy:false,again:false,pending:false});st.pending=true;clearTimeout(st.t);st.t=setTimeout(()=>vFlush(d),1200)}
async function vFlush(d){const st=dsave[d.id];if(!st||!st.pending)return;clearTimeout(st.t);if(st.busy){st.again=true;return}
  st.busy=true;st.pending=false;d.studiedAt=Date.now();await Store.put("decks",d);st.busy=false;
  if(st.again){st.again=false;st.pending=true;vFlush(d)}}

/* list + side */
function vVisible(){let a=S.decks.slice();const st={};a.forEach(d=>st[d.id]=dStats(d));
  if(S.kind==="due")a=a.filter(d=>st[d.id].due>0);
  if(S.kind==="star")a=a.filter(d=>st[d.id].star>0);
  if(S.subject)a=a.filter(d=>subj(d)===S.subject);
  const q=norm(S.q).trim();
  if(q){a=a.filter(d=>norm([d.title,d.subject,(d.cards||[]).map(c=>c.t+" "+c.d).join(" ")].join(" ")).includes(q));
    return a.sort((x,y)=>(norm(y.title).includes(q)?1:0)-(norm(x.title).includes(q)?1:0)||(y.updatedAt||0)-(x.updatedAt||0))}
  const f={updated:(x,y)=>(y.updatedAt||0)-(x.updatedAt||0),created:(x,y)=>(y.createdAt||0)-(x.createdAt||0),title:(x,y)=>String(x.title||"").localeCompare(String(y.title||""),"vi"),review:(x,y)=>st[y.id].due-st[x.id].due||(y.updatedAt||0)-(x.updatedAt||0)}[S.sort];
  return a.sort(f)}

  $("#navTags").innerHTML="";
}

  if(!S.decks.length){L.innerHTML=`<div class="lempty"><b>Chưa có bộ từ nào</b>Dán danh sách từ, nhập tệp${S.sample?" hoặc nhờ Claude tạo theo chủ đề":""}.${S.canWrite?`<button class="btn primary" data-act="new">${icon("plus")}Bộ từ mới</button>`:""}</div>`;return}

    ${dueDecks.length?`<div><p class="h3">Cần ôn hôm nay</p><div style="display:flex;flex-direction:column;gap:6px">${dueDecks.slice(0,6).map(([d,s])=>`<button class="dueitem" data-opend="${esc(d.id)}"><span class="dot" style="--c:${hue(subj(d))}"></span><span class="t">${esc(d.title)}</span><span class="w">${s.due} thẻ</span></button>`).join("")}</div></div>`:""}
    ${S.canWrite?`<div class="actrow"><button class="btn primary lg" data-act="new">${icon("plus")}Bộ từ mới</button>${S.sample?`<button class="btn soft lg" data-vv="gentopic">${icon("spark")}Nhờ Claude tạo bộ từ theo chủ đề</button>`:""}</div>`:""}

/* flashcards */
function vStartCards(d,subset){
  let cs=(d.cards||[]).filter(c=>c.t||c.d);if(subset)cs=cs.filter(c=>subset.includes(c.id));
  if(!cs.length){toast("Bộ từ chưa có thẻ.");return}
  const order=cs.map(c=>c.id);if(S.vopt.shuffle)shuffle(order);
  if(S.vtimer){clearInterval(S.vtimer);S.vtimer=null}
  S.vs={deckId:d.id,deck:d,mode:"cards",order,i:0,flip:false,know:[],still:[],done:false};vEnter();vRender(true);vAutoSay()}
function vCardsHtml(V){
  const d=V.deck;

function vStartLearn(d,subset){

  const pri=c=>{const b=c.box||0;const due=b>0&&(c.due||0)<=now;return (due?0:b===0?1:b<4?2:3)*10+b+Math.random()};
  const batch=cs.slice().sort((a,b)=>pri(a)-pri(b)).slice(0,10);
  const multi=(d.cards||[]).filter(c=>c.t&&c.d).length>=2;
  if(S.vtimer){clearInterval(S.vtimer);S.vtimer=null}
  S.vs={deckId:d.id,deck:d,mode:"learn",queue:batch.map(c=>({id:c.id,stage:multi?0:1,miss:false})),total:batch.length,done:0,cur:null,fb:null,finished:false,opts:[]};
  vEnter();vNextLearn()}
function vNextLearn(){const V=S.vs;if(!V||V.mode!=="learn")return;V.fb=null;V.cur=null;
  while(V.queue.length&&!V.cur){const it=V.queue.shift();const c=V.deck.cards.find(x=>x.id===it.id);if(c){it.c=c;V.cur=it}}
  if(!V.cur){V.finished=true;vFlush(V.deck);vRender(true);return}
  const it=V.cur,c=it.c;
  if(it.stage===0){const others=shuffle(V.deck.cards.filter(x=>x.id!==c.id&&x.d&&ansNorm(x.d)!==ansNorm(c.d))).slice(0,3);V.opts=shuffle([c,...others])}

function vLearnPick(id){const V=S.vs;if(!V||!V.cur||V.fb)return;const pick=V.deck.cards.find(x=>x.id===id);const ok=id===V.cur.c.id||(pick&&ansNorm(pick.d)===ansNorm(V.cur.c.d));

/* test */
function vTestSetup(d){const n=(d.cards||[]).filter(c=>c.t&&c.d).length;if(n<2){toast("Cần ít nhất 2 thẻ có đủ từ và nghĩa.");return}
  if(S.vtimer){clearInterval(S.vtimer);S.vtimer=null}
  S.vs={deckId:d.id,deck:d,mode:"test",phase:"setup",ans:{}};vEnter();vRender(true)}
function vTopt(){const o=S.vopt.test||(S.vopt.test={});o.count=o.count||"10";o.dir=o.dir||"term";o.types=Object.assign({mc:true,wr:true,tf:true,mt:true},o.types||{});return o}
function vBuildTest(d){
  const o=vTopt();const pool=(d.cards||[]).filter(c=>c.t&&c.d);const cs=shuffle(pool.slice());
  const n=o.count==="all"?cs.length:Math.min(+o.count||10,cs.length);let rest=cs.slice(0,n);
  let types=["mc","wr","tf","mt"].filter(t=>o.types[t]);if(!types.length)types=["mc"];
  const dirOf=()=>o.dir==="mix"?(Math.random()<.5?"term":"def"):o.dir;const qs=[],mts=[];
  if(types.includes("mt")){const only=types.length===1;if(rest.length>=3||only){const k=only?rest.length:Math.min(5,Math.max(3,Math.round(rest.length/4)));const grp=rest.splice(0,k);
    while(grp.length){const g=grp.splice(0,5);if(g.length>=2)mts.push({type:"mt",cards:g.map(c=>c.id),order:shuffle(g.map(c=>c.id)),dir:dirOf()});else rest.push(...g)}}}
  const other=types.filter(t=>t!=="mt"),ot=other.length?other:["mc"];
  rest.forEach((c,j)=>{const t=ot[j%ot.length],dir=dirOf();
    if(t==="mc"){const key=dir==="term"?"t":"d";const opts=shuffle([c,...shuffle(pool.filter(x=>x.id!==c.id&&ansNorm(x[key])!==ansNorm(c[key]))).slice(0,3)]);qs.push({type:"mc",c,dir,opts:opts.map(x=>x.id)})}
    else if(t==="wr")qs.push({type:"wr",c,dir});
    else{const others=pool.filter(x=>x.id!==c.id&&ansNorm(x.d)!==ansNorm(c.d));const truth=!others.length||Math.random()<.5;qs.push({type:"tf",c,dir,truth,shown:truth?c.id:shuffle(others)[0].id})}});
  shuffle(qs);return [...qs,...mts];
}
function vAnswered(V,k){const a=V.ans[k],q=V.qs[k];if(!q)return false;if(q.type==="mt")return Array.isArray(a)&&a.some(x=>x!=null);if(q.type==="wr")return !!String(a||"").trim();return a!=null}
function vTestStart(){const V=S.vs;if(!V)return;V.qs=vBuildTest(V.deck);V.ans={};V.phase="take";V.start=Date.now();V.graded=false;vRender(true)}
function vTQ(V,q,k,rv){

      ${rv&&!r.pts?`<div class="tres"><span>Đáp án đúng: <span class="right">${esc(q.c[ansKey])}</span></span><button class="linkbtn" data-vv="tover" data-k="${k}">Tôi trả lời đúng, tính điểm câu này</button></div>`:rv&&r.close?`<div class="tres"><span>Gần đúng · đáp án chuẩn: <span class="right">${esc(q.c[ansKey])}</span></span></div>`:""}`}

      ${rv&&!r.pts?`<div class="tres"><span>Nghĩa của “${esc(q.c.t)}” là <span class="right">${esc(q.c.d)}</span></span></div>`:""}`}

    body=`<div style="color:var(--muted);font-size:13.5px">Chọn chữ cái của đáp án tương ứng cho mỗi mục.</div><div class="mtgrid"><div>${pr.map((c,i)=>{const s=sel[i];const ok=rv?(s!=null&&q.order[s]===c.id):null;

      <div class="mtans">${an.map((c,j)=>`<div><b>${LET[j]}</b><span>${esc(c[ansKey])}</span></div>`).join("")}</div></div>`}
  return `<article class="tq${rv?(r.pts===r.max?" ok":" bad"):""}"><div class="rvh"><span class="n">Câu ${k+1}</span><span class="pill info">${typeL}</span>${rv?`<span class="pill ${r.pts===r.max?"good":"bad"}">${r.max>1?`${r.pts}/${r.max} cặp đúng`:r.pts?"Đúng":"Sai"}</span>`:""}</div>${body}</article>`;
}

    V.deck.tests=[{at:Date.now(),pct:V.pct,pts,max,secs:V.secs},...(V.deck.tests||[])].slice(0,20)}

function parseVocab(text){
  const out=[];
  for(let line of String(text||"").replace(/\r\n?/g,"\n").split("\n")){
    line=line.replace(/^\s*(?:\d{1,4}[\.\)]\s+|[-•*]\s+)/,"").trim();if(!line)continue;
    let t=line,d="";
    for(const s of ["\t"," - "," – "," — "," : "," = ","=",": "," | ",";"]){const i=line.indexOf(s);if(i>0){t=line.slice(0,i);d=line.slice(i+s.length);break}}
    let ph="";const pm=t.match(/\s*([\/\[][^\/\]]{1,60}[\/\]])\s*/);if(pm){ph=pm[1];t=t.replace(pm[0]," ")}
    if(!ph){const pm2=d.match(/^\s*([\/\[][^\/\]]{1,60}[\/\]])\s*/);if(pm2){ph=pm2[1];d=d.slice(pm2[0].length)}}
    let ex="";const parts=d.split(/\s+\|\s+|\s*(?:VD|Ví dụ|Example|E\.g\.)\s*[:]\s*/i);if(parts.length>1){d=parts[0];ex=parts.slice(1).join(" ")}
    t=t.replace(/\s+/g," ").trim();d=d.trim();if(!t&&!d)continue;
    out.push({id:uid("c"),t,d,ph:ph.trim(),ex:ex.trim()});
  }
  return out;
}

/* ---------- import files as notes ---------- */
const NOTE_ACCEPT=".docx,.pdf,.md,.markdown,.txt,.html,.htm,text/plain,text/markdown,text/html,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document";
function mdInline(n){
  let s="";
  const wrap=(x,m)=>{const y=x.trim();if(!y)return x;return x.match(/^\s*/)[0]+m+y+m+x.match(/\s*$/)[0]};
  for(const c of n.childNodes){
    if(c.nodeType===3){s+=c.textContent.replace(/\s+/g," ");continue}
    if(c.nodeType!==1)continue;
    const t=c.tagName,x=mdInline(c);
    if(t==="STRONG"||t==="B")s+=wrap(x,"**");
    else if(t==="EM"||t==="I")s+=wrap(x,"_");
    else if(t==="CODE")s+=wrap(x,"`");
    else if(t==="A"){const h=c.getAttribute("href")||"";s+=/^https?:/i.test(h)&&x.trim()?`[${x.trim()}](${h})`:x}
    else if(t==="BR")s+="  \n";
    else if(t==="IMG")continue;
    else s+=x;
  }
  return s;
}
function mdList(el,lvl){
  const ord=el.tagName==="OL";let i=0;const lines=[];
  for(const li of el.children){if(li.tagName!=="LI")continue;i++;let text="";const subs=[];
    for(const c of li.childNodes){
      if(c.nodeType===1&&(c.tagName==="UL"||c.tagName==="OL"))subs.push(mdList(c,lvl+1));
      else if(c.nodeType===1&&c.tagName==="P")text+=mdInline(c)+" ";
      else if(c.nodeType===3)text+=c.textContent.replace(/\s+/g," ");
      else if(c.nodeType===1)text+=mdInline(c);
    }
    lines.push("   ".repeat(lvl)+(ord?i+". ":"- ")+text.replace(/\s+/g," ").trim());subs.forEach(x=>lines.push(x));
  }
  return lines.join("\n");
}
function mdTable(tb){
  const rows=[...tb.querySelectorAll("tr")].map(tr=>[...tr.children].map(td=>mdInline(td).replace(/\|/g,"\\|").replace(/\s+/g," ").trim()));
  if(!rows.length)return "";const w=Math.max(...rows.map(r=>r.length));rows.forEach(r=>{while(r.length<w)r.push("")});
  return ["| "+rows[0].join(" | ")+" |","|"+rows[0].map(()=>"---").join("|")+"|",...rows.slice(1).map(r=>"| "+r.join(" | ")+" |")].join("\n");
}
function mdBlocks(n){
  const out=[];
  for(const c of n.childNodes){
    if(c.nodeType===3){const t=c.textContent.trim();if(t)out.push(t);continue}
    if(c.nodeType!==1)continue;const t=c.tagName;
    if(/^H[1-6]$/.test(t)){const x=mdInline(c).replace(/\*\*/g,"").trim();if(x)out.push("#".repeat(Math.min(+t[1],4))+" "+x)}
    else if(t==="UL"||t==="OL")out.push(mdList(c,0));
    else if(t==="TABLE")out.push(mdTable(c));
    else if(t==="BLOCKQUOTE")out.push(mdBlocks(c).split("\n").map(l=>"> "+l).join("\n"));
    else if(t==="PRE")out.push("```\n"+c.textContent.replace(/\n+$/,"")+"\n```");
    else if(t==="HR")out.push("---");
    else if(t==="P"||(t==="DIV"&&!c.querySelector("p,div,ul,ol,table,h1,h2,h3,h4,blockquote,pre"))){const x=mdInline(c).trim();if(x)out.push(x)}
    else if(t==="IMG"||t==="SCRIPT"||t==="STYLE")continue;
    else{const x=mdBlocks(c);if(x)out.push(x)}
  }
  return out.filter(Boolean).join("\n\n");
}
function htmlToMd(html){const d=new DOMParser().parseFromString(String(html||""),"text/html").body;return mdBlocks(d).replace(/\n{3,}/g,"\n\n").trim()}
function pdfTextToMd(text){
  const lines=String(text).split("\n").map(l=>l.replace(/\s+/g," ").trim());const out=[];let para="";
  const flush=()=>{if(para.trim())out.push(para.trim());para=""};
  for(const l of lines){
    if(!l){flush();continue}
    const bullet=l.match(/^[•●▪◦■\-–*]\s*(.*)$/);
    if(bullet){flush();out.push("- "+bullet[1]);continue}
    if(/^\d{1,2}[\.\)]\s/.test(l)){flush();para=l;continue}
    para+=(para?" ":"")+l;
    if(/[.!?:;]["”)]?$/.test(l))flush();
  }
  flush();
  return out.join("\n\n").replace(/\n\n(- )/g,"\n$1");
}
async function fileToMarkdown(f){
  const name=f.name.toLowerCase();
  if(f.size>15*1024*1024)throw new Error("Tệp quá lớn (tối đa 15 MB).");
  let md;
  if(name.endsWith(".docx")){
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js");
    const r=await window.mammoth.convertToHtml({arrayBuffer:await f.arrayBuffer()},{convertImage:window.mammoth.images.imgElement(()=>Promise.resolve({src:""}))});
    md=htmlToMd(r.value);
  }else if(name.endsWith(".pdf"))md=pdfTextToMd(await fileToText(f));
  else if(/\.html?$/.test(name))md=htmlToMd(await f.text());
  else if(name.endsWith(".doc"))throw new Error("Tệp .doc đời cũ chưa đọc được. Hãy lưu lại thành .docx hoặc .pdf.");
  else md=await f.text();
  md=String(md||"").replace(/\r\n?/g,"\n").trim();
  if(!md)throw new Error("Không tìm thấy chữ trong tệp (tệp scan dạng ảnh chưa đọc được).");
  const h=md.match(/^#{1,3}\s+(.+)$/m);
  return {title:(h?h[1]:f.name.replace(/\.[^.]+$/,"")).replace(/[*_`]/g,"").trim().slice(0,160),md};
}
function splitMd(md,max=200000){
  if(new Blob([md]).size<=max)return [md];
  const parts=[];let cur="";
  for(const block of md.split(/\n(?=#{1,3} )|\n\n/)){
    if(new Blob([cur+"\n\n"+block]).size>max&&cur){parts.push(cur);cur=block}else cur=cur?cur+"\n\n"+block:block;
  }
  if(cur)parts.push(cur);
  return parts.flatMap(p=>new Blob([p]).size>max?p.match(/[\s\S]{1,60000}/g):[p]);
}

  document.body.appendChild(s);
  const inp=$("#pq",s),res=$("#pres",s);let items=[],idx=0;
  const draw=()=>{const q=inp.value,nq=norm(q).trim();

    const decks=S.decks.filter(d=>!nq||norm([d.title,d.subject,(d.cards||[]).map(c=>c.t+" "+c.d).join(" ")].join(" ")).includes(nq)).map(d=>({type:"deck",x:d,t:nq&&norm(d.title).includes(nq)}));
    const all=[...notes,...quizzes,...decks].sort((a,b)=>((b.t?1:0)-(a.t?1:0))||(b.x.updatedAt||0)-(a.x.updatedAt||0));
    items=all.slice(0,9);
    if(S.canWrite)items.push({type:"new",q});

      :it.type==="deck"?`<button class="pr${i===idx?" on":""}" data-i="${i}">${icon("cards")}<span class="col"><span class="tt">${hlText(it.x.title,q)}</span><span class="ss">Bộ từ · ${esc(subj(it.x))} · ${(it.x.cards||[]).length} thẻ</span></span><span class="k">${rel(it.x.updatedAt)}</span></button>`
      :it.type==="quiz"?`<button class="pr${i===idx?" on":""}" data-i="${i}">${icon("quiz")}<span class="col"><span class="tt">${hlText(it.x.title,q)}</span><span class="ss">Bộ đề · ${esc(subj(it.x))} · ${validQs(it.x).length} câu</span></span><span class="k">${rel(it.x.updatedAt)}</span></button>`
      :`<button class="pr${i===idx?" on":""}" data-i="${i}">${icon("plus")}<span class="col"><span class="tt">${q.trim()?`Tạo ghi chú “${esc(q.trim())}”`:"Tạo ghi chú mới"}</span></span></button>`).join("")||`<div class="lempty">Không tìm thấy</div>`;
  };
  const close=()=>{s.remove();document.removeEventListener("keydown",key,true)};
  const go=async i=>{const it=items[i];if(!it)return;close();if(it.type==="note")openNote(it.x.id);else if(it.type==="quiz")openQuiz(it.x.id);else if(it.type==="deck")openDeck(it.x.id);else{if(!(await guard()))return;clearHash();openEditor();if(it.q.trim())$("#eTitle").value=it.q.trim()}};
  const key=e=>{if(e.key==="Escape"){e.preventDefault();e.stopPropagation();close()}else if(e.key==="ArrowDown"){e.preventDefault();idx=(idx+1)%items.length;draw();res.querySelector(".on")?.scrollIntoView({block:"nearest"})}else if(e.key==="ArrowUp"){e.preventDefault();idx=(idx-1+items.length)%items.length;draw();res.querySelector(".on")?.scrollIntoView({block:"nearest"})}else if(e.key==="Enter"){e.preventDefault();go(idx)}};
  document.addEventListener("keydown",key,true);
  inp.addEventListener("input",()=>{idx=0;draw()});
  s.addEventListener("click",e=>{if(e.target===s)close();const b=e.target.closest("[data-i]");if(b)go(+b.dataset.i)});
  draw();inp.focus();
}

      case "submit":submitRun(false);break;
      case "explain":explainQ(ra.dataset.q);break;
      case "exit":(async()=>{if(await guard())refresh(true)})();break;
      case "done":stopRun();refresh(true);break;
      case "again":{const z=S.quizzes.find(x=>x.id===R.quizId);if(z){const subset=R.retry?R.order.map(i=>R.qs[i].id):null;startRun(z,subset)}break}
      case "retryWrong":{const z=S.quizzes.find(x=>x.id===R.quizId);if(z){const wrong=R.result.items.filter(x=>!x.ok).map(x=>x.q);startRun(z,wrong)}break}

  const tg=t.closest("[data-tag]");if(tg){setFilter(()=>{S.tag=S.tag===tg.dataset.tag?null:tg.dataset.tag;S.subject=null;S.kind="all"});return}
  const jp=t.closest("[data-jump]");if(jp){e.preventDefault();const h=document.getElementById(jp.dataset.jump),sc=$("#nscroll");if(h&&sc)sc.scrollTo({top:h.offsetTop-sc.offsetTop-12,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});const d=$("#tocInline");if(d&&d.contains(jp))d.open=false;return}

document.addEventListener("keydown",e=>{
  if(document.querySelector(".scrim"))return;

  if(mod&&k==="s"){e.preventDefault();return}

      if(e.key==="ArrowRight"){e.preventDefault();goQ(R.i+1);return}
      if(e.key==="ArrowLeft"){e.preventDefault();goQ(R.i-1);return}
      if(k==="m"){R.flags[q.id]=!R.flags[q.id];renderRun(false);return}
      if(e.key==="Escape"){(async()=>{if(await guard())refresh(true)})();return}
    }
    return;
  }
  if(e.key==="/"){e.preventDefault();openPalette()}
  else if(k==="n"&&S.canWrite){e.preventDefault();openNew()}
  else if(k==="e"&&S.canWrite&&selNote()){e.preventDefault();openEditor(selNote())}
  else if(k==="e"&&S.canWrite&&selQuiz()){e.preventDefault();openQEdit(selQuiz())}

    const r=route();
    if(S.section==="vocab"){const v=vVisible();if(!v.length)return;const i=v.findIndex(d=>r.t==="deck"&&d.id===r.id);const nx=k==="j"?Math.min(v.length-1,i+1):Math.max(0,i<0?0:i-1);openDeck(v[nx].id)}
    else if(S.section==="quizzes"){const v=visibleQuizzes(allQStats());if(!v.length)return;const i=v.findIndex(z=>r.t==="quiz"&&z.id===r.id);const nx=k==="j"?Math.min(v.length-1,i+1):Math.max(0,i<0?0:i-1);openQuiz(v[nx].id)}
    else{const v=visibleNotes();if(!v.length)return;const i=v.findIndex(n=>r.t==="note"&&n.id===r.id);const nx=k==="j"?Math.min(v.length-1,i+1):Math.max(0,i<0?0:i-1);openNote(v[nx].id)}

});
