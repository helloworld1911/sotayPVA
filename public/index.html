<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121826">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Sổ Tay Ôn Tập</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<style>
/* Layout: three panes like a desk — shelf (notes / quiz bank), stack of index cards, the open page or the exam sheet. Reading in a book serif; highlighter yellow marks what to remember; green/red only for right/wrong. */
:root{
  --bg:#ECEFF5; --shelf:#E4E8F0; --surface:#FFFFFF; --surface-2:#F3F5F9; --ink:#121826; --muted:#5E6779; --faint:#8A93A6; --line:#DDE2EB;
  --accent:#2350E0; --accent-soft:#E3EAFD; --accent-ink:#FFFFFF; --hl:#FFE14D; --hl-soft:#FFF3B0; --hl-ink:#121826;
  --danger:#C6283D; --danger-soft:#FCE6E9; --ok:#0B8A68; --ok-soft:#DDF5EC; --warn:#B45309; --warn-soft:#FDEFD9;
  --shadow:0 1px 2px rgba(18,24,38,.05),0 10px 30px -14px rgba(18,24,38,.22);
  --s0:#2350E0; --s1:#0E8F6E; --s2:#C2410C; --s3:#B4237A; --s4:#6D4BD8; --s5:#A16207; --s6:#0369A1; --s7:#4D7C0F;
  --f-display:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;
  --f-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-read:"Literata",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1119; --shelf:#121722; --surface:#171D29; --surface-2:#1E2533; --ink:#E7EBF4; --muted:#9AA3B6; --faint:#6D768A; --line:#283043;
  --accent:#7C9BFF; --accent-soft:#222D4D; --accent-ink:#0D1119; --hl:#E8C93A; --hl-soft:#4A4120; --hl-ink:#121826;
  --danger:#FF6B7E; --danger-soft:#3A1C24; --ok:#34D3A6; --ok-soft:#14332B; --warn:#FBBF24; --warn-soft:#3A2E14;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 32px -14px rgba(0,0,0,.7);
  --s0:#7C9BFF; --s1:#34D3A6; --s2:#FB923C; --s3:#F472B6; --s4:#A78BFA; --s5:#FBBF24; --s6:#38BDF8; --s7:#A3E635;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1119; --shelf:#121722; --surface:#171D29; --surface-2:#1E2533; --ink:#E7EBF4; --muted:#9AA3B6; --faint:#6D768A; --line:#283043;
  --accent:#7C9BFF; --accent-soft:#222D4D; --accent-ink:#0D1119; --hl:#E8C93A; --hl-soft:#4A4120; --hl-ink:#121826;
  --danger:#FF6B7E; --danger-soft:#3A1C24; --ok:#34D3A6; --ok-soft:#14332B; --warn:#FBBF24; --warn-soft:#3A2E14;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 32px -14px rgba(0,0,0,.7);
  --s0:#7C9BFF; --s1:#34D3A6; --s2:#FB923C; --s3:#F472B6; --s4:#A78BFA; --s5:#FBBF24; --s6:#38BDF8; --s7:#A3E635;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hl-word{background:linear-gradient(transparent 56%,var(--hl) 56%,var(--hl) 90%,transparent 90%);padding:0 2px}

/* ===== shell ===== */
.app{height:100%;display:grid;grid-template-columns:248px 340px minmax(0,1fr);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.side{background:var(--shelf);display:flex;flex-direction:column;gap:16px;padding:18px 12px 14px 16px;overflow-y:auto;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:2px 4px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:17px;flex:none}
.brand b{font-family:var(--f-display);font-weight:800;font-size:18px;line-height:1.1;display:block}
.brand small{color:var(--muted);font-size:11.5px}
.secsw{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;padding:3px;border-radius:11px;background:color-mix(in srgb,var(--ink) 7%,transparent)}
.secsw button{border:0;background:none;height:48px;border-radius:8px;font-size:11.5px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;white-space:nowrap}
.secsw button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.secsw svg.i{width:16px;height:16px}
.quick{display:flex;flex-direction:column;gap:6px}
.qbtn{display:flex;align-items:center;gap:10px;height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:13.5px;text-align:left;width:100%}
.qbtn:hover{color:var(--ink);border-color:var(--faint)}
.qbtn kbd{margin-left:auto}
.qbtn.new{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.qbtn.new:hover{filter:brightness(1.07);color:var(--accent-ink)}
kbd{font-family:var(--f-mono);font-size:10.5px;color:var(--faint);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;line-height:17px;background:var(--surface)}
.qbtn.new kbd{color:inherit;border-color:color-mix(in srgb,var(--accent-ink) 40%,transparent);background:transparent}
.group{display:flex;flex-direction:column;gap:1px}
.glabel{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);padding:0 10px 6px}
.nav{display:flex;align-items:center;gap:10px;padding:0 10px;height:34px;border-radius:8px;border:0;background:none;text-align:left;width:100%;color:var(--ink);font-size:13.5px}
.nav:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.nav.on{background:var(--surface);box-shadow:var(--shadow);font-weight:600}
.nav .lbl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .n{margin-left:auto;font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.nav .i{color:var(--muted)}
.dot{width:10px;height:10px;border-radius:3px;background:var(--c,var(--muted));flex:none}
.tagcloud{display:flex;flex-wrap:wrap;gap:5px;padding:0 6px}
.tagbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--muted)}
.tagbtn:hover{color:var(--ink)}
.tagbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.status{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);padding:8px 10px}
.status .pip{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.status.sync .pip{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}

/* list pane */
.listpane{background:var(--surface-2);border-left:1px solid var(--line);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.lhead{padding:16px 14px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.lrow{display:flex;align-items:center;gap:8px}
.lrow h2{font-family:var(--f-display);font-weight:800;font-size:21px;margin:0;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.lcount{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
.ibtn{width:34px;height:34px;border-radius:9px;border:0;background:none;display:grid;place-items:center;color:var(--muted);flex:none}
.ibtn:hover{background:color-mix(in srgb,var(--ink) 7%,transparent);color:var(--ink)}
.ibtn.on{color:var(--accent);background:var(--accent-soft)}
.ibtn[disabled]{opacity:.35;cursor:default}
.menu-btn{display:none}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 10px;height:38px}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;height:100%;font-size:14px}
.search .i{color:var(--faint)}
.sortrow{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.sortrow select{border:0;background:none;font-size:12px;font-weight:600;color:var(--ink);padding:2px 0;cursor:pointer}
.list{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:4px;min-height:0}
.item{position:relative;display:flex;flex-direction:column;gap:5px;padding:12px 12px 11px 16px;border-radius:12px;border:1px solid transparent;background:none;text-align:left;width:100%;min-width:0}
.item::before{content:"";position:absolute;left:6px;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--c)}
.item:hover{background:color-mix(in srgb,var(--surface) 70%,transparent)}
.item.on{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow)}
.item .t{font-weight:700;font-size:14.5px;line-height:1.3;display:flex;gap:6px;align-items:flex-start;overflow-wrap:anywhere}
.item .t .pin{color:var(--accent);margin-left:auto;flex:none}
.item .t .pin svg{width:14px;height:14px;fill:currentColor}
.item .s{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.item .m{display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.item .m .sub{color:var(--c);font-weight:600}
.item .m .due{color:var(--danger);font-weight:600}
.item .bar{height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.item .bar i{display:block;height:100%;border-radius:4px}
mark{background:var(--hl);color:var(--hl-ink);border-radius:3px;padding:0 1px}
.lempty{padding:40px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center;font-size:13.5px}
.lempty b{font-family:var(--f-display);font-size:17px;color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill svg.i{width:12px;height:12px}
.pill.good{color:var(--ok);background:var(--ok-soft)}
.pill.mid{color:var(--warn);background:var(--warn-soft)}
.pill.bad{color:var(--danger);background:var(--danger-soft)}
.pill.info{color:var(--accent);background:var(--accent-soft)}
.pill.none{color:var(--muted);background:var(--surface-2)}

/* note pane */
.notepane{background:var(--surface);min-height:0;min-width:0;display:flex;flex-direction:column;container-type:inline-size}
.ntop{display:flex;align-items:center;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line);min-height:56px;flex-wrap:wrap}
.crumb{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);min-width:0;flex:1}
.crumb .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back-btn{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.soft{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.btn.hlb{background:var(--hl-soft);color:var(--ink);border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.danger.solid{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.ghost{background:none;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.lg{height:44px;padding:0 20px;font-size:14.5px;border-radius:11px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.progress{height:3px;background:transparent;flex:none}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s linear}
.nscroll{flex:1;overflow-y:auto;min-height:0}
.doc{max-width:1060px;margin:0 auto;padding:36px 40px 80px;display:grid;grid-template-columns:minmax(0,1fr);gap:36px}
@container (min-width:940px){.doc{grid-template-columns:minmax(0,1fr) 210px}.toc-inline{display:none}}
@container (max-width:939px){.toc-side{display:none}}
@container (max-width:560px){.doc{padding:22px 18px 100px}}
.dhead{grid-column:1/-1;display:flex;flex-direction:column;gap:12px;max-width:72ch}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);padding:3px 10px;border-radius:999px;align-self:flex-start;max-width:100%}
.dhead h1{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,4.2cqi,42px);line-height:1.08;letter-spacing:-.02em;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.dmeta{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center;font-variant-numeric:tabular-nums}
.dmeta span{display:inline-flex;align-items:center;gap:5px}
.dmeta svg.i{width:14px;height:14px}
.tag{font-size:12px;color:var(--muted);background:var(--surface-2);padding:2px 8px;border-radius:6px}
.quizbar{grid-column:1/-1;max-width:72ch;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:12px;background:var(--hl-soft);font-size:13.5px}
.quizbar .meter{flex:1 1 120px;height:6px;border-radius:6px;background:color-mix(in srgb,var(--ink) 12%,transparent);overflow:hidden;min-width:80px}
.quizbar .meter i{display:block;height:100%;background:var(--ink);width:0;transition:width .25s ease}

/* reading */
.md{min-width:0;overflow-wrap:anywhere}
article.md{max-width:70ch;font-family:var(--f-read);font-size:var(--fs,17px);line-height:1.75}
article.md.sans{font-family:var(--f-ui);line-height:1.68}
.md>*:first-child{margin-top:0}
.md>*:last-child{margin-bottom:0}
.md h1,.md h2,.md h3,.md h4{font-family:var(--f-display);line-height:1.22;letter-spacing:-.01em;text-wrap:balance;scroll-margin-top:16px}
.md h1{font-size:1.65em;margin:1.6em 0 .5em}
.md h2{font-size:1.4em;margin:2em 0 .6em;font-weight:800}
.md h3{font-size:1.12em;margin:1.6em 0 .4em;font-weight:600}
.md p{margin:.75em 0}
.md ul,.md ol{padding-left:1.35em;margin:.6em 0}
.md li{margin:.3em 0;padding-left:.15em}
.md li::marker{color:var(--accent);font-weight:700}
.md strong{font-weight:700;background:linear-gradient(transparent 60%,var(--hl-soft) 60%);padding:0 1px;border-radius:2px}
.md a{color:var(--accent);text-underline-offset:3px}
.md blockquote{margin:1.2em 0;padding:12px 18px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 12px 12px 0;font-size:.95em}
.md blockquote p{margin:.25em 0}
.md code{font-family:var(--f-mono);font-size:.82em;background:var(--surface-2);padding:2px 6px;border-radius:5px}
.md pre{background:var(--surface-2);padding:14px 16px;border-radius:10px;overflow-x:auto;line-height:1.55}
.md pre code{background:none;padding:0}
.md hr{border:0;border-top:1px solid var(--line);margin:2.2em 0}
.md .tablewrap{overflow-x:auto;margin:1.2em 0;border:1px solid var(--line);border-radius:12px}
.md table{border-collapse:collapse;width:100%;font-family:var(--f-ui);font-size:.82em;line-height:1.5}
.md th,.md td{padding:10px 13px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.md th{background:var(--surface-2);font-weight:700;font-size:.92em}
.md tr:last-child td{border-bottom:0}
.md img{border-radius:10px}
.selftest .md strong{background:var(--ink);color:transparent;cursor:pointer;border-radius:4px;transition:background .2s,color .2s;user-select:none}
.selftest .md strong *{color:transparent!important}
.selftest .md strong:hover{background:color-mix(in srgb,var(--ink) 80%,var(--accent))}
.selftest .md strong.shown{background:linear-gradient(transparent 60%,var(--hl) 60%);color:inherit;cursor:default;user-select:auto}
.selftest .md strong.shown *{color:inherit!important}
.toc-side{position:sticky;top:20px;align-self:start;display:flex;flex-direction:column;gap:14px}
.toc{display:flex;flex-direction:column;font-size:12.5px}
.toc .glabel{padding-left:12px}
.toc a{color:var(--muted);text-decoration:none;padding:4px 12px;border-left:2px solid var(--line);line-height:1.35}
.toc a.l3{padding-left:24px;font-size:12px}
.toc a:hover{color:var(--ink)}
.toc a.on{color:var(--accent);border-left-color:var(--accent);font-weight:600}
.toc-inline{max-width:70ch;border:1px solid var(--line);border-radius:12px;padding:4px 14px}
.toc-inline summary{cursor:pointer;font-weight:600;font-size:13px;padding:8px 0;color:var(--muted)}
.toc-inline .toc{padding-bottom:10px}
.card{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:var(--muted);background:var(--surface)}
.card .big{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.donebar{max-width:70ch;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px;border-radius:14px;border:1px dashed var(--line);font-size:13.5px;color:var(--muted)}

/* welcome */
.welcome{max-width:760px;margin:0 auto;padding:56px 40px 80px;display:flex;flex-direction:column;gap:28px}
@container (max-width:560px){.welcome{padding:28px 18px 100px}}
.welcome h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,5cqi,46px);line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
.welcome p.lead{margin:0;color:var(--muted);font-size:15.5px;max-width:54ch}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stats .card b{font-family:var(--f-display);font-weight:800;font-size:30px;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
.dueitem{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);width:100%;text-align:left}
.dueitem:hover{border-color:var(--faint)}
.dueitem .t{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dueitem .w{font-size:12px;color:var(--danger);white-space:nowrap}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;font-size:13px;color:var(--muted)}
.keys div{display:flex;align-items:center;gap:8px}
.h3{font-family:var(--f-display);font-weight:800;font-size:17px;margin:0 0 10px}
.actrow{display:flex;gap:8px;flex-wrap:wrap}
pre.tpl{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-family:var(--f-mono);font-size:12.5px;line-height:1.6;overflow-x:auto;margin:0;white-space:pre}

/* note editor */
.editor{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr)}
.editor.split{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.epane{min-width:0;min-height:0;overflow-y:auto;padding:26px 32px 80px}
@container (max-width:560px){.epane{padding:18px 16px 110px}}
.epane.prev{border-left:1px solid var(--line);background:var(--surface-2)}
.editor:not(.split) .epane.prev{display:none}
.efields{display:flex;flex-direction:column;gap:12px;max-width:760px;margin:0 auto}
.titlein{border:0;outline:0;background:none;font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:-.015em;width:100%;padding:2px 0;line-height:1.15}
.titlein::placeholder{color:var(--faint)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@container (max-width:620px){.row2{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.fld input,.fld select{height:38px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:0 11px;width:100%;min-width:0}
.fld input:focus,.mdin:focus,.tin:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.mdtools{display:flex;gap:2px;flex-wrap:wrap;align-items:center;padding:5px;border:1px solid var(--line);border-bottom:0;border-radius:11px 11px 0 0;background:var(--surface-2);position:sticky;top:-26px;z-index:2}
.mdtools button{border:0;background:none;height:30px;min-width:32px;padding:0 8px;border-radius:7px;font-size:12.5px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.mdtools button:hover{background:var(--surface);color:var(--ink)}
.mdtools .sp{flex:1}
.mdin{width:100%;min-height:56vh;resize:vertical;border:1px solid var(--line);border-radius:0 0 11px 11px;background:var(--surface);padding:16px;font-family:var(--f-mono);font-size:13.5px;line-height:1.7;tab-size:2;display:block}
.plabel{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin-bottom:16px}
.dirty{font-size:12px;color:var(--faint);white-space:nowrap}

/* ===== quiz: overview ===== */
.qwrap{max-width:860px;margin:0 auto;padding:32px 40px 90px;display:flex;flex-direction:column;gap:22px}
@container (max-width:560px){.qwrap{padding:20px 16px 110px}}
.startcard{border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:18px;background:var(--surface-2)}
.optgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.og{display:flex;flex-direction:column;gap:8px;min-width:0}
.og .glabel{padding:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.ch{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--muted);text-align:left;display:flex;flex-direction:column;gap:1px}
.ch small{font-weight:500;font-size:11.5px;color:var(--faint)}
.ch:hover{border-color:var(--faint);color:var(--ink)}
.ch.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.ch.on small{color:var(--accent)}
.tg{display:flex;align-items:center;gap:10px;border:0;background:none;padding:4px 0;font-size:13.5px;color:var(--ink);text-align:left}
.tg .sw{width:34px;height:20px;border-radius:20px;background:var(--line);position:relative;flex:none;transition:background .15s}
.tg .sw::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.tg[aria-pressed="true"] .sw{background:var(--accent)}
.tg[aria-pressed="true"] .sw::after{transform:translateX(14px)}
.startrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.startrow .note{font-size:12.5px;color:var(--muted)}
.warnbox{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--ink);font-size:13.5px}
.warnbox .i{color:var(--warn);margin-top:1px}
.hist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.hrow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr) minmax(90px,2fr) auto;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px;font-variant-numeric:tabular-nums}
.hrow:last-child{border-bottom:0}
.hrow .when{color:var(--muted)}
.hbar{height:8px;border-radius:8px;background:var(--surface-2);overflow:hidden;position:relative}
.hbar i{display:block;height:100%;border-radius:8px}
.hbar::after{content:"";position:absolute;left:70%;top:-2px;bottom:-2px;width:1.5px;background:var(--faint)}
@container (max-width:560px){.hrow{grid-template-columns:minmax(0,1fr) auto;row-gap:6px}.hrow .hbar{grid-column:1/-1;grid-row:3}}
.qprev{border:1px solid var(--line);border-radius:14px;padding:4px 16px}
.qprev summary{cursor:pointer;font-weight:600;font-size:13.5px;padding:10px 0}
.qprev ol{margin:0 0 12px;padding-left:1.4em;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.qprev li::marker{color:var(--faint);font-variant-numeric:tabular-nums}
.qprev .ans{color:var(--ok);font-weight:600;font-size:12.5px}

/* ===== quiz: taking ===== */
.timer{font-family:var(--f-mono);font-size:13px;font-weight:500;padding:5px 10px;border-radius:8px;background:var(--surface-2);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.timer.low{background:var(--danger-soft);color:var(--danger)}
.take{max-width:1080px;margin:0 auto;padding:30px 40px 90px;display:grid;grid-template-columns:minmax(0,1fr);gap:32px}
@container (min-width:900px){.take{grid-template-columns:minmax(0,1fr) 230px}}
@container (max-width:560px){.take{padding:18px 16px 110px}}
.tmain{display:flex;flex-direction:column;gap:18px;min-width:0;max-width:740px}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qno{font-family:var(--f-display);font-weight:800;font-size:15px;color:var(--accent)}
.qno small{color:var(--faint);font-weight:600;font-size:13px}
.flagbtn{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.flagbtn svg.i{width:14px;height:14px}
.flagbtn.on{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.flagbtn.on svg{fill:currentColor}
.qtext{font-family:var(--f-read);font-size:19px;line-height:1.6;font-weight:500}
.qtext strong{background:none}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:flex-start;gap:14px;padding:13px 15px;border-radius:13px;border:1.5px solid var(--line);background:var(--surface);text-align:left;width:100%;font-size:15px;line-height:1.5;transition:border-color .12s,background .12s}
.opt:hover:not([disabled]){border-color:var(--faint)}
.opt .let{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--surface-2);color:var(--muted);flex:none;margin-top:-2px}
.opt.multi .let{border-radius:50%}
.opt .ot{flex:1;min-width:0;overflow-wrap:anywhere}
.opt .mk{flex:none;font-size:12px;font-weight:700;align-self:center}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .let{background:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .let{background:var(--ok);color:var(--surface)}
.opt.right .mk{color:var(--ok)}
.opt.wrong{border-color:var(--danger);background:var(--danger-soft)}
.opt.wrong .let{background:var(--danger);color:var(--surface)}
.opt.wrong .mk{color:var(--danger)}
.opt.dim{opacity:.6}
.opt[disabled]{cursor:default}
.fb{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;font-size:14.5px;line-height:1.65}
.fb.ok{background:var(--ok-soft)}
.fb.bad{background:var(--danger-soft)}
.fb .v{font-family:var(--f-display);font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px}
.fb.ok .v{color:var(--ok)}
.fb.bad .v{color:var(--danger)}
.fb .md{font-family:var(--f-ui)}
.tnav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tnav .sp{flex:1}
.tside{display:flex;flex-direction:column;gap:12px;align-self:start;position:sticky;top:20px}
.tside .glabel{padding:0}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:5px}
.qg{height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;position:relative}
.qg.ans{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.qg.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.qg.no{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.qg.cur{outline:2px solid var(--ink);outline-offset:1px}
.qg.flag::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.keyhint{font-size:11.5px;color:var(--faint);line-height:1.8}

/* ===== quiz: result ===== */
.rhero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center;padding:24px;border-radius:18px;background:var(--surface-2);border:1px solid var(--line)}
@container (max-width:600px){.rhero{grid-template-columns:1fr;justify-items:start;gap:18px}}
.ring{--p:0;--rc:var(--accent);width:148px;height:148px;border-radius:50%;background:conic-gradient(var(--rc) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;position:relative;flex:none}
.ring::before{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--surface-2)}
.ring div{position:relative;text-align:center;display:flex;flex-direction:column;gap:2px}
.ring b{font-family:var(--f-display);font-weight:800;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.ring span{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.rtext{display:flex;flex-direction:column;gap:12px;min-width:0}
.rtext h1{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,3.6cqi,32px);margin:0;line-height:1.1;letter-spacing:-.015em}
.rtext p{margin:0;color:var(--muted)}
.rstats{display:flex;flex-wrap:wrap;gap:8px}
.rstat{display:flex;flex-direction:column;padding:8px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);min-width:84px}
.rstat b{font-family:var(--f-display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.1}
.rstat small{font-size:11.5px;color:var(--muted)}
.rstat.ok b{color:var(--ok)} .rstat.bad b{color:var(--danger)}
.rfilter{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rfilter .ch{flex-direction:row;gap:6px;align-items:center}
.rev{display:flex;flex-direction:column;gap:12px}
.rv{border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;border-left-width:4px}
.rv.ok{border-left-color:var(--ok)}
.rv.bad{border-left-color:var(--danger)}
.rv.skip{border-left-color:var(--faint)}
.rvh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rvh .n{font-family:var(--f-display);font-weight:800;color:var(--muted)}
.rv .qtext{font-size:16.5px}
.rvo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rvo li{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;font-size:14px;line-height:1.5}
.rvo .let{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted);flex:none}
.rvo .ot{flex:1;min-width:0;overflow-wrap:anywhere}
.rvo .mk{font-size:11.5px;font-weight:700;white-space:nowrap;align-self:center}
.rvo li.right{background:var(--ok-soft)} .rvo li.right .let{background:var(--ok);color:var(--surface)} .rvo li.right .mk{color:var(--ok)}
.rvo li.wrong{background:var(--danger-soft)} .rvo li.wrong .let{background:var(--danger);color:var(--surface)} .rvo li.wrong .mk{color:var(--danger)}
.exp{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px;font-size:14.5px;line-height:1.65}
.exp .glabel{padding:0}
.thinking{color:var(--muted);font-style:italic}

/* ===== quiz: editor ===== */
.importbox{border:1px solid var(--line);border-radius:16px;background:var(--surface-2)}
.importbox>summary{cursor:pointer;padding:14px 16px;font-weight:700;display:flex;align-items:center;gap:8px;list-style:none}
.importbox>summary::-webkit-details-marker{display:none}
.importbox>summary .i{color:var(--accent)}
.importbox>summary .chev{margin-left:auto;color:var(--faint);transition:transform .15s;display:inline-flex}
.importbox[open]>summary .chev{transform:rotate(90deg)}
.ib{display:flex;flex-direction:column;gap:12px;padding:0 16px 16px}
.files{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@container (max-width:620px){.files{grid-template-columns:1fr}}
.filebtn{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;border:1.5px dashed var(--line);background:var(--surface);text-align:left;min-width:0}
.filebtn:hover{border-color:var(--accent)}
.filebtn .i{color:var(--accent)}
.filebtn span{display:flex;flex-direction:column;min-width:0}
.filebtn b{font-size:13.5px}
.filebtn small{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filebtn.has{border-style:solid;border-color:var(--ok)}
.filebtn.has small{color:var(--ok);font-weight:600}
.srcin{width:100%;min-height:200px;resize:vertical;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px;font-family:var(--f-mono);font-size:13px;line-height:1.65;display:block}
.srcin:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ibacts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ibacts label{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.zmsg{font-size:13px;color:var(--muted);margin:0}
.zmsg.ok{color:var(--ok)} .zmsg.bad{color:var(--danger)}
.fmt summary{cursor:pointer;font-size:12.5px;color:var(--accent);font-weight:600}
.fmt[open] summary{margin-bottom:8px}
.qehead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qehead h3{font-family:var(--f-display);font-weight:800;font-size:19px;margin:0;margin-right:auto}
.qelist{display:flex;flex-direction:column;gap:12px}
.qe{border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.qe.bad{border-color:color-mix(in srgb,var(--warn) 55%,var(--line))}
.qeh{display:flex;align-items:center;gap:8px}
.qeh b{font-family:var(--f-display);font-weight:800;font-size:14px;color:var(--muted)}
.qeh .sp{flex:1}
.tin{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;resize:vertical;min-height:44px;line-height:1.5}
.optrow{display:flex;align-items:center;gap:8px}
.optrow .let{width:22px;text-align:center;font-weight:700;font-size:12.5px;color:var(--muted);flex:none}
.optrow input[type=text]{flex:1;min-width:0;height:38px;border:1px solid var(--line);border-radius:9px;padding:0 10px;background:var(--surface)}
.optrow input[type=text]:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ck{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:9px;border:1px solid var(--line);flex:none;cursor:pointer;background:var(--surface)}
.ck input{width:17px;height:17px;accent-color:var(--ok);cursor:pointer;margin:0}
.ck:has(input:checked){background:var(--ok-soft);border-color:var(--ok)}
.qewarn{font-size:12px;color:var(--warn);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.qewarn svg.i{width:14px;height:14px}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;font-size:12.5px;padding:4px 0;align-self:flex-start}

/* ===== vocab ===== */
.vbar{display:flex;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.vbar i,.mbar i{display:block;height:100%}
.mbar{display:flex;height:10px;border-radius:10px;overflow:hidden;background:var(--line)}
.mleg{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted);align-items:center;font-variant-numeric:tabular-nums}
.mleg span{display:inline-flex;align-items:center;gap:6px}
.mleg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.mleg svg.i{width:14px;height:14px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left;transition:border-color .12s,box-shadow .12s}
.mode svg.i{width:26px;height:26px;color:var(--accent);margin-bottom:6px}
.mode b{font-size:15px}
.mode small{font-size:12.5px;color:var(--muted);line-height:1.4}
.mode:hover:not([disabled]){border-color:var(--accent);box-shadow:var(--shadow)}
.mode[disabled]{opacity:.5;cursor:not-allowed}
.vlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto;gap:14px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.vrow:last-child{border-bottom:0}
.vrow .vt b{font-size:15px;display:block;overflow-wrap:anywhere}
.vrow .ph{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.vrow .vd{font-size:14px;overflow-wrap:anywhere;min-width:0}
.vrow .ex{font-size:12.5px;color:var(--muted);font-style:italic;margin-top:2px}
.vact{display:flex;align-items:center;gap:2px}
.lv{width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--line);flex:none}
.lv.learning{background:var(--warn)} .lv.known{background:var(--ok)}
.ibtn.star.on{color:var(--s5)} .ibtn.star.on svg{fill:currentColor}
@container (max-width:560px){.vrow{grid-template-columns:minmax(0,1fr) auto}.vrow .vd{grid-column:1/-1;grid-row:2}}
.say{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;color:var(--accent);flex:none}
.say:hover{border-color:var(--accent)}
.say.sm{width:30px;height:30px} .say.sm svg.i{width:15px;height:15px}
.fcwrap{max-width:760px;margin:0 auto;padding:28px 40px 90px;display:flex;flex-direction:column;gap:18px}
.fccount{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.fccount .still{color:var(--warn)} .fccount .know{color:var(--ok)}
.fc{perspective:1400px;height:min(380px,52vh);cursor:pointer;outline-offset:4px}
.fci{position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.fc.flip .fci{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:30px 26px;text-align:center;overflow:auto;
  background:linear-gradient(to bottom,transparent 52px,color-mix(in srgb,var(--danger) 32%,transparent) 52px,color-mix(in srgb,var(--danger) 32%,transparent) 53.5px,transparent 53.5px),repeating-linear-gradient(to bottom,transparent 0 33px,color-mix(in srgb,var(--accent) 8%,transparent) 33px 34px),var(--surface)}
.face.back{transform:rotateY(180deg);background:var(--surface-2)}
.fterm{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,6cqi,48px);line-height:1.1;letter-spacing:-.01em;overflow-wrap:anywhere}

<script>
/* Kết nối trang với API của Worker: tài khoản, dữ liệu, Claude */
(function(){
  "use strict";
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  let authShown=false;
  async function showAuth(msg,mode){
    if(authShown)return;authShown=true;
    let cfg={inviteRequired:false};try{cfg=await (await fetch("/api/config")).json()}catch(e){}
    const s=document.createElement("div");s.className="scrim center";s.style.zIndex="90";
    let tab=mode||"login";
    const render=()=>{s.innerHTML=`<form class="dialog" id="authForm" style="max-width:400px" novalidate>
      <h3>Sổ Tay Ôn Tập</h3>
      <div class="secsw" style="grid-template-columns:1fr 1fr;margin:2px 0 4px"><button type="button" data-tab="login" class="${tab==="login"?"on":""}" style="height:38px;flex-direction:row;font-size:13px">Đăng nhập</button><button type="button" data-tab="register" class="${tab==="register"?"on":""}" style="height:38px;flex-direction:row;font-size:13px">Đăng ký</button></div>
      <p>${tab==="login"?"Đăng nhập để mở sổ tay của bạn.":"Tạo tài khoản mới. Mỗi tài khoản có ghi chú, bộ đề và bộ từ riêng."}</p>
      ${tab==="register"?`<div class="fld"><label for="auName">Tên hiển thị</label><input id="auName" autocomplete="name" maxlength="60" placeholder="VD: Việt Anh"></div>`:""}
      <div class="fld"><label for="auUser">Tên đăng nhập</label><input id="auUser" autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="32" placeholder="VD: vietanh" required></div>
      <div class="fld"><label for="auPw">Mật khẩu</label><input id="auPw" type="password" autocomplete="${tab==="login"?"current-password":"new-password"}" required placeholder="${tab==="register"?"Ít nhất 8 ký tự":""}"></div>
      ${tab==="register"?`<div class="fld"><label for="auPw2">Nhập lại mật khẩu</label><input id="auPw2" type="password" autocomplete="new-password" required></div>
      ${cfg.inviteRequired?`<div class="fld"><label for="auInv">Mã mời</label><input id="auInv" autocomplete="off" required></div>`:""}`:""}
      <p class="zmsg bad" id="auMsg">${esc(msg||"")}</p>
      <div class="acts"><button class="btn primary lg" type="submit" style="width:100%">${tab==="login"?"Đăng nhập":"Tạo tài khoản"}</button></div></form>`;
      msg="";setTimeout(()=>s.querySelector(tab==="register"?"#auName":"#auUser")?.focus(),30)};
    render();document.body.appendChild(s);
    s.addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(b){tab=b.dataset.tab;render()}});
    s.addEventListener("submit",async e=>{e.preventDefault();const m=s.querySelector("#auMsg");m.textContent="";
      const v=id=>(s.querySelector(id)||{}).value||"";
      const body={username:v("#auUser").trim(),password:v("#auPw")};
      if(!body.username||!body.password){m.textContent="Hãy nhập tên đăng nhập và mật khẩu.";return}
      if(tab==="register"){if(body.password.length<8){m.textContent="Mật khẩu cần ít nhất 8 ký tự.";return}if(body.password!==v("#auPw2")){m.textContent="Hai mật khẩu chưa khớp.";return}body.name=v("#auName").trim();body.invite=v("#auInv").trim()}
      const btn=s.querySelector('button[type="submit"]');btn.disabled=true;
      try{const r=await fetch(tab==="login"?"/api/login":"/api/register",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});
        const j=await r.json().catch(()=>({}));
        if(r.ok){if(j.claimed)try{sessionStorage.setItem("st-claimed","1")}catch(e){}location.reload();return}
        m.textContent=j.error||"Không thực hiện được, thử lại nhé.";}
      catch(err){m.textContent="Không kết nối được máy chủ."}
      btn.disabled=false});
  }
  async function api(method,path,body){
    let r;
    try{r=await fetch("/api"+path,{method,credentials:"same-origin",headers:body!==undefined?{"content-type":"application/json"}:{},body:body!==undefined?JSON.stringify(body):undefined})}
    catch(e){throw{code:"unavailable",message:"network"}}
    if(r.status===401){showAuth("Phiên đăng nhập đã hết hạn, hãy đăng nhập lại.");throw{code:"unavailable",message:"login"}}
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw{code:r.status===413||r.status===400?"invalid_argument":"unavailable",message:j.error||r.statusText};
    return j;
  }
  const listeners={},cache={};
  function emit(col){
    const docs=(cache[col]||[]).map(x=>({id:x.id,exists:true,data:()=>x.data,metadata:{fromCache:false,hasPendingWrites:false}}));
    const snap={docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{fromCache:false,hasPendingWrites:false}};
    (listeners[col]||new Set()).forEach(fn=>{try{fn(snap)}catch(e){console.error(e)}});
  }
  async function pull(col){const j=await api("GET","/data/"+col);cache[col]=j.docs||[];emit(col)}
  const pullAll=()=>Object.keys(listeners).forEach(c=>pull(c).catch(()=>{}));
  setInterval(()=>{if(!document.hidden)pullAll()},60000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)pullAll()});
  const db={collection(col){return{
    onSnapshot(next,err){(listeners[col]||(listeners[col]=new Set())).add(next);pull(col).catch(e=>err&&err(e));return()=>listeners[col].delete(next)},
    doc(id){return{
      async set(data){await api("PUT","/data/"+col+"/"+encodeURIComponent(id),data);const a=cache[col]||(cache[col]=[]);const rec={id,data:JSON.parse(JSON.stringify(data))};const i=a.findIndex(x=>x.id===id);if(i>=0)a[i]=rec;else a.unshift(rec);emit(col)},
      async delete(){await api("DELETE","/data/"+col+"/"+encodeURIComponent(id));cache[col]=(cache[col]||[]).filter(x=>x.id!==id);emit(col)}
    }}
  }}};
  const user={isOwner:async()=>true,canEdit:async()=>true,can:async()=>true,id:async()=>"me"};
  function parseLoose(t){t=String(t||"").trim();try{return JSON.parse(t)}catch(e){}
    const f=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(f){try{return JSON.parse(f[1])}catch(e){}}
    const a=Math.min(...["[","{"].map(c=>{const i=t.indexOf(c);return i<0?Infinity:i})),b=Math.max(t.lastIndexOf("]"),t.lastIndexOf("}"));
    if(a<b)return JSON.parse(t.slice(a,b+1));throw new Error("no json")}
  async function ask(input,opts,asJson){
    opts=opts||{};const prompt=typeof input==="string"?input:(input||[]).map(m=>m.content).join("\n\n");
    let r;
    try{r=await fetch("/api/ai",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({prompt,json:!!asJson}),signal:opts.signal})}
    catch(e){if(e&&e.name==="AbortError")throw{code:"cancelled",message:"cancelled"};throw{code:"upstream_error",message:"network"}}
    if(r.status===401){showAuth("Phiên đăng nhập đã hết hạn, hãy đăng nhập lại.");throw{code:"session_expired",message:"login"}}
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw{code:j.code||(r.status===429?"rate_limited":"upstream_error"),message:j.error||""};
    const text=j.text||"";
    if(opts.onText&&text)try{opts.onText({text,delta:text})}catch(e){}
    if(!asJson)return{text,truncated:!!j.truncated,modelTierApplied:"default"};
    try{return parseLoose(text)}catch(e){throw{code:"invalid_json",message:"invalid json",text}}
  }
  const ready=(async()=>{try{const r=await fetch("/api/me",{credentials:"same-origin"});if(r.status===401){showAuth();return null}if(!r.ok)return null;return await r.json()}catch(e){return null}})();
  window.claude={async use(name){
    const me=await ready;
    if(!me)return new Promise(()=>{});
    if(name==="db")return db;
    if(name==="user")return user;
    if(name==="sample"){if(!me.ai)return null;const f=(i,o)=>ask(i,o,false);f.json=(i,o)=>ask(i,o,true);f.limits=async()=>({maxPromptBytes:262144});return f}
    return null;
  }};
  function changePw(){
    const s=document.createElement("div");s.className="scrim center";s.style.zIndex="90";
    s.innerHTML=`<form class="dialog" style="max-width:400px"><h3>Đổi mật khẩu</h3>
      <div class="fld"><label for="cpOld">Mật khẩu hiện tại</label><input id="cpOld" type="password" autocomplete="current-password"></div>
      <div class="fld"><label for="cpNew">Mật khẩu mới</label><input id="cpNew" type="password" autocomplete="new-password" placeholder="Ít nhất 8 ký tự"></div>
      <div class="fld"><label for="cpNew2">Nhập lại mật khẩu mới</label><input id="cpNew2" type="password" autocomplete="new-password"></div>
      <p class="zmsg bad" id="cpMsg"></p><div class="acts"><button type="button" class="btn ghost" data-x>Huỷ</button><button class="btn primary" type="submit">Lưu</button></div></form>`;
    document.body.appendChild(s);setTimeout(()=>s.querySelector("#cpOld").focus(),30);
    s.addEventListener("click",e=>{if(e.target===s||e.target.closest("[data-x]"))s.remove()});
    s.addEventListener("submit",async e=>{e.preventDefault();const m=s.querySelector("#cpMsg"),n=s.querySelector("#cpNew").value;
      if(n.length<8){m.textContent="Mật khẩu mới cần ít nhất 8 ký tự.";return}if(n!==s.querySelector("#cpNew2").value){m.textContent="Hai mật khẩu chưa khớp.";return}
      const r=await fetch("/api/password",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({old:s.querySelector("#cpOld").value,new:n})}).catch(()=>null);
      const j=r?await r.json().catch(()=>({})):{};if(r&&r.ok){s.remove();alertToast("Đã đổi mật khẩu")}else m.textContent=j.error||"Không đổi được mật khẩu."});
  }
  function alertToast(t){let el=document.getElementById("toast");if(!el){el=document.createElement("div");el.id="toast";el.className="toast";document.body.appendChild(el)}el.textContent=t;el.hidden=false;setTimeout(()=>el.hidden=true,2800)}
  document.addEventListener("DOMContentLoaded",async()=>{
    const me=await ready;if(!me||!me.user)return;
    const side=document.getElementById("side"),st=document.getElementById("status");if(!side||!st)return;
    const box=document.createElement("div");box.className="userbox";
    box.innerHTML=`<div style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line)"><span style="width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none">${esc((me.user.name||me.user.username).trim().charAt(0).toUpperCase())}</span><span style="min-width:0;flex:1;display:flex;flex-direction:column;line-height:1.25"><b style="font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(me.user.name)}</b><small style="color:var(--muted);font-size:11.5px">@${esc(me.user.username)}</small></span></div>
      <div style="display:flex;gap:4px;padding:4px 4px 0"><button class="linkbtn" data-cp>Đổi mật khẩu</button><span style="flex:1"></span><button class="linkbtn" data-lo>Đăng xuất</button></div>`;
    st.style.marginTop="0";side.insertBefore(box,st);box.style.marginTop="auto";
    box.querySelector("[data-cp]").addEventListener("click",changePw);
    box.querySelector("[data-lo]").addEventListener("click",async()=>{await fetch("/api/logout",{method:"POST"}).catch(()=>{});location.reload()});
    try{if(sessionStorage.getItem("st-claimed")){sessionStorage.removeItem("st-claimed");setTimeout(()=>alertToast("Chào mừng! Dữ liệu cũ đã được chuyển vào tài khoản của bạn."),800)}}catch(e){}
  });
})();

</script>
<script>
(function(){
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const icon=n=>`<svg class="i"><use href="#i-${n}"/></svg>`;
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const isMac=/Mac|iPhone|iPad/.test(navigator.platform||"");
if(isMac)$("#kbdK").textContent="⌘ K";
const LET="ABCDEFGH";
const PASS=70;

const S={notes:[],quizzes:[],attempts:[],decks:[],vs:null,vedit:null,vtimer:null,vfilter:"all",vopt:Object.assign({front:"term",auto:false,shuffle:true,test:{count:"10",dir:"term",types:{mc:true,wr:true,tf:true,mt:true}}},LS.get("vopt",{})),section:"notes",kind:"all",subject:null,tag:null,q:"",sort:LS.get("sort","updated"),mode:"loading",canWrite:true,db:null,sample:null,
  editing:null,dirty:false,selfTest:false,split:LS.get("split",true),fs:LS.get("fs",17),serif:LS.get("serif",true),
  qedit:null,run:null,timerI:null,qo:Object.assign({mode:"practice",count:"all",shuffle:true,shuffleOpts:false,timed:false},LS.get("qopts",{}))};
const STALE=7*864e5;

/* ---------- helpers ---------- */
function norm(s){let o="";for(const ch of String(s||"")){let n=ch.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();if(ch==="đ"||ch==="Đ")n="d";o+=n.length===1?n:(n[0]||" ")}return o}
function plain(md){return String(md||"").replace(/```[\s\S]*?```/g," ").replace(/!\[[^\]]*\]\([^)]*\)/g," ").replace(/\[([^\]]*)\]\([^)]*\)/g,"$1").replace(/^\s{0,3}(#{1,6}|>|[-*+]|\d+\.)\s+/gm,"").replace(/[*_`~|]/g," ").replace(/^[\s:-]+$/gm,"").replace(/\s+/g," ").trim()}
function hlText(text,q){const t=String(text||"");const nq=norm(q||"").trim();if(!nq)return esc(t);const nt=norm(t);let out="",i=0,j;while((j=nt.indexOf(nq,i))!==-1){out+=esc(t.slice(i,j))+"<mark>"+esc(t.slice(j,j+nq.length))+"</mark>";i=j+nq.length}return out+esc(t.slice(i))}
function snippet(n,q){const p=plain(n.content);if(q){const k=norm(p).indexOf(norm(q).trim());if(k>40)return "…"+p.slice(k-30,k+180)}return p.slice(0,200)}
function hue(name){let h=0;for(const c of String(name||""))h=(h*31+c.charCodeAt(0))>>>0;return `var(--s${h%8})`}
function words(md){return plain(md).split(/\s+/).filter(Boolean).length}
function mins(md){return Math.max(1,Math.round(words(md)/200))}
function rel(ts){if(!ts)return "—";const d=(Date.now()-ts)/1000;if(d<60)return "vừa xong";if(d<3600)return Math.floor(d/60)+" phút trước";if(d<86400)return Math.floor(d/3600)+" giờ trước";if(d<172800)return "hôm qua";if(d<604800)return Math.floor(d/86400)+" ngày trước";const x=new Date(ts);return x.getDate()+"/"+(x.getMonth()+1)+"/"+x.getFullYear()}
function dur(s){s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0")}
function uid(p="n"){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function tagsOf(s){return [...new Set(String(s||"").split(",").map(t=>t.trim()).filter(Boolean))].slice(0,12)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const subj=n=>n.subject||"Chưa phân loại";
const isDue=n=>!n.lastReviewedAt||Date.now()-n.lastReviewedAt>STALE;
const pctClass=p=>p==null?"none":p>=PASS?"good":p>=50?"mid":"bad";
const pctColor=p=>p>=PASS?"var(--ok)":p>=50?"var(--warn)":"var(--danger)";
function renderMd(md){
  let html;
  try{html=window.marked?marked.parse(md||"",{gfm:true,breaks:false,headerIds:false,mangle:false}):null}catch(e){html=null}
  if(html==null)return "<p>"+esc(md).replace(/\n/g,"<br>")+"</p>";
  return window.DOMPurify?DOMPurify.sanitize(html):"<pre>"+esc(md)+"</pre>";
}
function inlineMd(s){
  let h;try{h=window.marked?marked.parseInline(String(s||"")):null}catch(e){h=null}
  return h==null||!window.DOMPurify?esc(s):DOMPurify.sanitize(h);
}
function decorate(el){
  el.querySelectorAll("table").forEach(t=>{if(!t.parentElement.classList.contains("tablewrap")){const w=document.createElement("div");w.className="tablewrap";t.parentNode.insertBefore(w,t);w.appendChild(t)}});
  el.querySelectorAll("a[href]").forEach(a=>{a.target="_blank";a.rel="noopener"});
  const hs=[...el.querySelectorAll("h2,h3")];hs.forEach((h,i)=>h.id="sec-"+i);return hs;
}
let toastT;function toast(msg){let t=$("#toast");if(!t){t=document.createElement("div");t.id="toast";t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)}t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2800)}
function confirmBox(title,msg,okText="Xoá",danger=true,cancelText="Huỷ"){return new Promise(res=>{const s=document.createElement("div");s.className="scrim center";s.innerHTML=`<div class="dialog" role="dialog" aria-modal="true"><h3>${esc(title)}</h3><p>${esc(msg)}</p><div class="acts"><button class="btn ghost" data-a="0">${esc(cancelText)}</button><button class="btn ${danger?"danger solid":"primary"}" data-a="1">${esc(okText)}</button></div></div>`;const done=v=>{s.remove();document.removeEventListener("keydown",k,true);res(v)};const k=e=>{if(e.key==="Escape"){e.stopPropagation();e.preventDefault();done(false)}};s.addEventListener("click",e=>{if(e.target===s)done(false);const b=e.target.closest("[data-a]");if(b)done(b.dataset.a==="1")});document.addEventListener("keydown",k,true);document.body.appendChild(s);s.querySelector('[data-a="1"]').focus()})}
function sampleErr(e){const c=e&&e.code;
  if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c)){S.sample=null;setTimeout(()=>refresh(true),0);return "Tính năng Claude chưa được bật cho trang này."}
  if(c==="cancelled")return "";
  if(c==="rate_limited")return "Claude đang bận hoặc bạn đã dùng hết lượt. Thử lại sau ít phút.";
  if(c==="prompt_too_large")return "Nội dung quá dài. Hãy chia nhỏ rồi thử lại.";
  if(c==="invalid_json")return "Claude trả về sai định dạng. Bấm thử lại.";
  if(c==="refused")return "Claude không xử lý được nội dung này.";
  if(c==="session_expired")return "Phiên đăng nhập đã hết hạn. Hãy đăng nhập lại.";
  return "Không kết nối được với Claude. Thử lại nhé.";}

/* ---------- storage ---------- */
const LKEY={notes:"notes-local",quizzes:"quizzes-local",attempts:"attempts-local",decks:"decks-local"};
function patchLocal(col,doc){const a=S[col];const i=a.findIndex(x=>x.id===doc.id);if(i>=0)a[i]=doc;else a.push(doc)}
const Store={
  async put(col,doc){
    if(S.mode==="db"){try{await S.db.collection(col).doc(doc.id).set(doc);patchLocal(col,doc);return true}catch(e){return fail(e)}}
    patchLocal(col,doc);LS.set(LKEY[col],S[col]);return true;
  },
  async del(col,id){
    if(S.mode==="db"){try{await S.db.collection(col).doc(id).delete();S[col]=S[col].filter(x=>x.id!==id);return true}catch(e){return fail(e)}}
    S[col]=S[col].filter(x=>x.id!==id);LS.set(LKEY[col],S[col]);return true;
  },
  save(n){return this.put("notes",n)},remove(id){return this.del("notes",id)}
};
function fail(e){
  const c=e&&e.code;
  if(c==="invalid_argument"){S.canWrite=false;refresh(true);toast("Bạn chỉ có quyền xem sổ tay này.")}
  else if(c==="quota_exceeded")toast("Bộ nhớ đã đầy. Hãy xoá bớt dữ liệu cũ rồi thử lại.");
  else if(c==="resource_exhausted")toast("Thao tác quá nhanh, đợi vài giây rồi thử lại.");
  else toast("Chưa lưu được. Kiểm tra kết nối rồi thử lại.");
  return false;
}

async function boot(){
  refresh(true);
  let db=null,user=null,sample=null;
  try{if(window.claude&&typeof window.claude.use==="function"){[db,user,sample]=await Promise.all([window.claude.use("db"),window.claude.use("user"),window.claude.use("sample")])}}catch(e){}
  S.sample=typeof sample==="function"?sample:null;
  if(db){
    S.db=db;S.mode="db";
    try{if(user){const own=await user.isOwner();const ce=await user.canEdit();S.canWrite=!!(own||ce)}}catch(e){}
    ["notes","quizzes","attempts","decks"].forEach(col=>{let first=true;
      db.collection(col).onSnapshot(snap=>{S[col]=snap.docs.map(d=>Object.assign(JSON.parse(JSON.stringify(d.data()||{})),{id:d.id}));refresh(first);first=false},()=>toast("Mất kết nối với kho dữ liệu. Tải lại trang để thử lại."))});
  }else{S.mode="local";S.notes=LS.get(LKEY.notes,[]);S.quizzes=LS.get(LKEY.quizzes,[]);S.attempts=LS.get(LKEY.attempts,[]);S.decks=LS.get(LKEY.decks,[])}
  refresh(true);
}

/* ---------- routing / derived ---------- */
function route(){const h=location.hash.slice(1);if(h.startsWith("note-"))return{t:"note",id:h.slice(5)};if(h.startsWith("quiz-"))return{t:"quiz",id:h.slice(5)};if(h.startsWith("deck-"))return{t:"deck",id:h.slice(5)};return{t:null,id:null}}
function selNote(){const r=route();return r.t==="note"?S.notes.find(n=>n.id===r.id):null}
function selQuiz(){const r=route();return r.t==="quiz"?S.quizzes.find(z=>z.id===r.id):null}
function clearHash(){history.replaceState(null,"",location.pathname+location.search)}
function validQ(q){return !!(q&&String(q.q||"").trim()&&Array.isArray(q.opts)&&q.opts.filter(o=>String(o).trim()).length>=2&&Array.isArray(q.ans)&&q.ans.length>0&&q.ans.every(a=>a>=0&&a<q.opts.length&&String(q.opts[a]).trim()))}
function validQs(z){return (z.questions||[]).filter(validQ)}
function qStats(id){const at=S.attempts.filter(a=>a.quizId===id).sort((a,b)=>(b.finishedAt||0)-(a.finishedAt||0));if(!at.length)return{count:0,best:null,last:null,list:at};return{count:at.length,best:Math.max(...at.map(a=>a.pct||0)),last:at[0],list:at}}
function allQStats(){const st={};S.quizzes.forEach(z=>st[z.id]=qStats(z.id));return st}

function visibleNotes(){
  let a=S.notes.slice();
  if(S.kind==="pinned")a=a.filter(n=>n.pinned);
  if(S.kind==="review")a=a.filter(isDue);
  if(S.subject)a=a.filter(n=>subj(n)===S.subject);
  if(S.tag)a=a.filter(n=>(n.tags||[]).includes(S.tag));
  const q=norm(S.q).trim();
  if(q){a=a.filter(n=>norm([n.title,n.subject,(n.tags||[]).join(" "),n.content].join(" ")).includes(q));
    return a.sort((x,y)=>(norm(y.title).includes(q)?1:0)-(norm(x.title).includes(q)?1:0)||(y.updatedAt||0)-(x.updatedAt||0))}
  const f={updated:(x,y)=>(y.updatedAt||0)-(x.updatedAt||0),created:(x,y)=>(y.createdAt||0)-(x.createdAt||0),title:(x,y)=>String(x.title||"").localeCompare(String(y.title||""),"vi"),review:(x,y)=>(x.reviews||0)-(y.reviews||0)||(x.lastReviewedAt||0)-(y.lastReviewedAt||0)}[S.sort];
  a.sort(f);a.sort((x,y)=>(y.pinned?1:0)-(x.pinned?1:0));return a;
}
function visibleQuizzes(st){
  let a=S.quizzes.slice();
  if(S.kind==="new")a=a.filter(z=>!st[z.id].count);
  if(S.kind==="weak")a=a.filter(z=>st[z.id].count&&st[z.id].best<PASS);
  if(S.subject)a=a.filter(z=>subj(z)===S.subject);
  const q=norm(S.q).trim();
  if(q){a=a.filter(z=>norm([z.title,z.subject,(z.questions||[]).map(x=>x.q).join(" ")].join(" ")).includes(q));
    return a.sort((x,y)=>(norm(y.title).includes(q)?1:0)-(norm(x.title).includes(q)?1:0)||(y.updatedAt||0)-(x.updatedAt||0))}
  const f={updated:(x,y)=>(y.updatedAt||0)-(x.updatedAt||0),created:(x,y)=>(y.createdAt||0)-(x.createdAt||0),title:(x,y)=>String(x.title||"").localeCompare(String(y.title||""),"vi"),review:(x,y)=>st[x.id].count-st[y.id].count||(x.updatedAt||0)-(y.updatedAt||0)}[S.sort];
  return a.sort(f);
}
function subjectsOf(arr){const m=new Map();arr.forEach(n=>m.set(subj(n),(m.get(subj(n))||0)+1));return [...m].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],"vi"))}
function allSubjects(){return [...new Set([...S.notes,...S.quizzes,...S.decks].map(x=>x.subject).filter(Boolean))]}
function tags(){const m=new Map();S.notes.forEach(n=>(n.tags||[]).forEach(t=>m.set(t,(m.get(t)||0)+1)));return [...m].sort((a,b)=>b[1]-a[1]).slice(0,24)}

/* ---------- render shell ---------- */
function paneSig(){
  const r=route();
  if(r.t==="note"){const n=selNote();if(n)return "note:"+n.id+":"+n.updatedAt+":"+(n.reviews||0)+":"+!!n.pinned+":"+(S.sample?1:0)}
  if(r.t==="quiz"){const z=selQuiz();if(z)return "quiz:"+z.id+":"+z.updatedAt+":"+S.attempts.filter(a=>a.quizId===z.id).length}
  if(r.t==="deck"){const d=selDeck();if(d)return "deck:"+d.id+":"+d.updatedAt+":"+(d.studiedAt||0)+":"+(S.canWrite?1:0)}
  return "home:"+S.section+":"+S.notes.length+":"+S.quizzes.length+":"+S.decks.length+":"+S.attempts.length+":"+S.mode+":"+(S.sample?1:0)+":"+S.canWrite;
}
function refresh(full){
  renderStatus();renderSide();renderList();
  document.querySelectorAll('[data-act="new"],[data-act="import"]').forEach(b=>b.hidden=!S.canWrite);
  if(S.editing||S.qedit||S.vedit)return;
  if(S.run){const r=route();if(r.t==="quiz"&&r.id===S.run.quizId)return;stopRun()}
  if(S.vs){const r=route();if(r.t==="deck"&&r.id===S.vs.deckId)return;vStop()}
  const P=$("#pane"),sig=paneSig(),id=sig.split(":").slice(0,2).join(":");
  if(full||P.dataset.sig!==sig)renderPane(!full&&P.dataset.pid===id);
}
function renderStatus(){const st=$("#status");st.classList.toggle("sync",S.mode==="db");$("#statusText").textContent=S.mode==="db"?(S.canWrite?"Đồng bộ trên mọi thiết bị":"Chế độ chỉ xem"):S.mode==="local"?"Lưu trên trình duyệt này":"Đang kết nối…"}

  const on=k=>S.kind===k&&!S.subject&&!S.tag?" on":"";
  if(S.section==="vocab"){vSide(on);return}
  if(qz){
    const st=allQStats();
    const nNew=S.quizzes.filter(z=>!st[z.id].count).length,nWeak=S.quizzes.filter(z=>st[z.id].count&&st[z.id].best<PASS).length;
    $("#navMain").innerHTML=`<div class="glabel">Ngân hàng đề</div>
     <button class="nav${on("all")}" data-kind="all">${icon("quiz")}<span class="lbl">Tất cả bộ đề</span><span class="n">${S.quizzes.length}</span></button>
     <button class="nav${on("new")}" data-kind="new">${icon("play")}<span class="lbl">Chưa làm</span><span class="n">${nNew}</span></button>

    const subs=subjectsOf(S.quizzes);
    $("#navSubjects").innerHTML=subs.length?`<div class="glabel">Môn học</div>`+subs.map(([s,n])=>`<button class="nav${S.subject===s?" on":""}" data-subject="${esc(s)}"><span class="dot" style="--c:${hue(s)}"></span><span class="lbl">${esc(s)}</span><span class="n">${n}</span></button>`).join(""):"";
    $("#navTags").innerHTML="";

  }

  $("#navMain").innerHTML=`<div class="glabel">Thư viện</div>
   <button class="nav${on("all")}" data-kind="all">${icon("stack")}<span class="lbl">Tất cả ghi chú</span><span class="n">${c}</span></button>
   <button class="nav${on("pinned")}" data-kind="pinned">${icon("pin")}<span class="lbl">Đã ghim</span><span class="n">${p}</span></button>
   <button class="nav${on("review")}" data-kind="review">${icon("alarm")}<span class="lbl">Cần ôn lại</span><span class="n">${r}</span></button>`;
  const subs=subjectsOf(S.notes);
  $("#navSubjects").innerHTML=subs.length?`<div class="glabel">Môn học</div>`+subs.map(([s,n])=>`<button class="nav${S.subject===s?" on":""}" data-subject="${esc(s)}"><span class="dot" style="--c:${hue(s)}"></span><span class="lbl">${esc(s)}</span><span class="n">${n}</span></button>`).join(""):"";
  const tg=tags();
  $("#navTags").innerHTML=tg.length?`<div class="glabel">Thẻ</div><div class="tagcloud">`+tg.map(([t])=>`<button class="tagbtn${S.tag===t?" on":""}" data-tag="${esc(t)}">#${esc(t)}</button>`).join("")+`</div>`:"";
}
function listTitle(){if(S.subject)return S.subject;if(S.tag)return "#"+S.tag;if(S.section==="vocab")return {all:"Tất cả bộ từ",due:"Cần ôn hôm nay",star:"Có thẻ gắn sao"}[S.kind]||"Tất cả bộ từ";if(S.section==="quizzes")return {all:"Tất cả bộ đề",new:"Chưa làm",weak:`Dưới ${PASS}%`}[S.kind]||"Tất cả bộ đề";return {all:"Tất cả ghi chú",pinned:"Đã ghim",review:"Cần ôn lại"}[S.kind]||"Tất cả ghi chú"}

/* ---------- parser ---------- */
const RE_Q=/^\s*(?:câu|cau|question|q|bài|bai)?\s*(\d{1,3})\s*[\.\):\-–]\s*(.*)$/i;
const RE_QWORD=/^\s*(?:câu|cau|question)\s*(\d{1,3})\s*[\.\):\-–]?\s*(.*)$/i;
const RE_OPT=/^\s*(\*)?\s*\(?([A-Ha-h])\s*[\.\):]\s*(.*)$/;
const RE_ANS=/^\s*(?:đáp\s*án(?:\s*đúng)?|dap\s*an(?:\s*dung)?|answer|ans|correct(?:\s*answer)?|key)\s*[:\-–=]\s*(.*)$/i;
const RE_EXP=/^\s*(?:giải\s*thích|giai\s*thich|explanation|explain|lời\s*giải|loi\s*giai|vì\s*sao|lý\s*do|ly\s*do|rationale|reason)\s*[:\-–]\s*(.*)$/i;
const RE_KEYHEAD=/^\s*(?:#+\s*)?(?:bảng\s*|phần\s*)?(?:đáp\s*án|dap\s*an|answer\s*key|answers|key|lời\s*giải)\s*:?\s*$/i;
const RE_KEYENT=/(?:câu\s*|cau\s*|q\s*)?(\d{1,3})\s*[\s\.\)\-:=|]*\s*([A-Ha-h](?:\s*[,&\/;]?\s*(?:và\s*)?[A-Ha-h])*)(?![A-Za-zÀ-ỹ])/gi;
const MARK_RIGHT=/\s*(?:\((?:đúng|dung|correct|x|✓)\)|✓|✔|\[x\])\s*$/i;
function lettersFrom(str,opts){
  const s=String(str||"").trim();if(!s)return {ans:[],rest:""};
  const m=s.match(/^\(?([A-Ha-h](?:\s*(?:,|;|&|\/|và|and)?\s*[A-Ha-h])*)\)?(?![A-Za-zÀ-ỹ])\s*[\.\-–:,]?\s*([\s\S]*)$/);
  if(m){const ans=[...new Set(m[1].match(/[A-Ha-h]/g).map(c=>c.toUpperCase().charCodeAt(0)-65))];return {ans,rest:m[2]||""}}
  if(opts&&opts.length){const ns=norm(s);const i=opts.findIndex(o=>norm(o).trim()&&(ns===norm(o).trim()||ns.startsWith(norm(o).trim())));if(i>=0)return {ans:[i],rest:""}}
  const loose=[...s.matchAll(/(?:^|[^A-Za-zÀ-ỹ])([A-H])(?=$|[^A-Za-zÀ-ỹ])/g)].map(x=>x[1].charCodeAt(0)-65);
  return {ans:[...new Set(loose)].slice(0,4),rest:""};
}
function parseKey(text){const map={};if(!text)return map;for(const m of String(text).matchAll(RE_KEYENT)){const n=+m[1];if(map[n])continue;map[n]=[...new Set(m[2].match(/[A-Ha-h]/g).map(c=>c.toUpperCase().charCodeAt(0)-65))]}return map}
function isQuestionish(t){return /\?\s*$/.test(t)||/^(ai|cái gì|điều gì|khi nào|tại sao|vì sao|which|what|who|when|how|why)\b/i.test(t)}
function parseQuiz(text,keyText){
  const lines=String(text||"").replace(/\r\n?/g,"\n").replace(/\u00a0/g," ").split("\n");
  const numbered=lines.some(l=>{const m=l.match(RE_Q);return m&&!RE_OPT.test(l)&&m[2].trim().length>2});
  const qs=[];let cur=null,mode=null,keyLines=[],inKey=false,lastNum=0;
  const push=()=>{if(cur){cur.q=cur.q.trim();cur.exp=cur.exp.trim();cur.opts=cur.opts.map(o=>o.trim());qs.push(cur)}};
  const start=(num,txt)=>{push();cur={id:uid("q"),num:num??(qs.length+1),q:txt||"",opts:[],ans:[],exp:""};mode="q";if(num!=null)lastNum=num};
  const addOpt=(txt,star)=>{let t=txt,right=!!star;if(MARK_RIGHT.test(t)){t=t.replace(MARK_RIGHT,"");right=true}
    const parts=t.split(/\s{1,}(?=[B-H][\.\)]\s)/);
    const first=parts.shift();cur.opts.push(first);if(right)cur.ans.push(cur.opts.length-1);
    for(const p of parts){const mm=p.match(/^([B-H])[\.\)]\s*([\s\S]*)$/);if(mm&&mm[1].charCodeAt(0)-65===cur.opts.length)cur.opts.push(mm[2]);else cur.opts[cur.opts.length-1]+=" "+p}
    mode="opt"};
  for(let li=0;li<lines.length;li++){
    const t=lines[li].trim();
    if(!t)continue;
    if(inKey){keyLines.push(t);continue}
    if(RE_KEYHEAD.test(t)){let j=li+1;while(j<lines.length&&!lines[j].trim())j++;
      if(j<lines.length&&/^\s*(?:câu\s*)?\d{1,3}\s*[\s\.\)\-:=|]*\s*[A-Ha-h](?![A-Za-zÀ-ỹ])/i.test(lines[j])){inKey=true;continue}
      if(cur){mode="ans";continue}}
    let m;
    if((m=t.match(RE_ANS))&&cur){const r=lettersFrom(m[1],cur.opts);if(r.ans.length)cur.ans=r.ans.filter(a=>a<Math.max(cur.opts.length,1)||!cur.opts.length);if(r.rest&&r.rest.length>3)cur.exp+=(cur.exp?"\n":"")+r.rest.replace(RE_EXP,"$1");mode=r.ans.length?"exp":"ans";continue}
    if((m=t.match(RE_EXP))&&cur){cur.exp+=(cur.exp?"\n":"")+m[1];mode="exp";continue}
    if(mode==="ans"&&cur){const r=lettersFrom(t,cur.opts);if(r.ans.length){cur.ans=r.ans;mode="exp";continue}}
    const om=t.match(RE_OPT);
    if(om&&cur){const idx=om[2].toUpperCase().charCodeAt(0)-65;
      if(idx===cur.opts.length&&(mode==="q"||mode==="opt")){addOpt(om[3],om[1]);continue}}
    const qm=t.match(RE_QWORD)||t.match(RE_Q);
    if(qm){const num=+qm[1],isWord=RE_QWORD.test(t);
      if(!cur||isWord||(cur.opts.length>=2&&(num===lastNum+1||num===1))){start(num,qm[2]);continue}}
    if(!numbered){
      if(!cur||(mode==="opt"&&cur.opts.length>=2)||(mode==="exp"&&cur.ans.length&&isQuestionish(t))){start(null,t);continue}
    }
    if(!cur)continue;
    if(mode==="q")cur.q+=(cur.q?"\n":"")+t;
    else if(mode==="opt")cur.opts[cur.opts.length-1]+=" "+t;
    else if(mode==="exp"||mode==="ans")cur.exp+=(cur.exp?"\n":"")+t;
  }
  push();
  const key=Object.assign(parseKey(keyLines.join("\n")),parseKey(keyText));
  qs.forEach((q,i)=>{const k=key[q.num]||key[i+1];if(k&&(!q.ans.length||keyText))q.ans=k});
  return qs.filter(q=>q.q||q.opts.length).map(q=>({id:q.id,q:q.q,opts:q.opts,ans:[...new Set(q.ans)].filter(a=>a>=0&&a<q.opts.length),exp:q.exp}));
}

/* ---------- file extraction ---------- */
const libs={};
function loadScript(src){return libs[src]||(libs[src]=new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>{delete libs[src];rej(new Error("load"))};document.head.appendChild(s)}))}
async function fileToText(f){
  const name=f.name.toLowerCase();
  if(f.size>15*1024*1024)throw new Error("Tệp quá lớn (tối đa 15 MB).");
  if(name.endsWith(".docx")){
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js");
    const r=await window.mammoth.convertToHtml({arrayBuffer:await f.arrayBuffer()});
    return htmlToText(r.value);
  }
  if(name.endsWith(".pdf")){
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js");
    const lib=window.pdfjsLib;lib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const pdf=await lib.getDocument({data:new Uint8Array(await f.arrayBuffer()),isEvalSupported:false}).promise;
    let out="";
    for(let p=1;p<=pdf.numPages;p++){const tc=await (await pdf.getPage(p)).getTextContent();let line="";
      for(const it of tc.items){line+=it.str;if(it.hasEOL){out+=line+"\n";line=""}}
      out+=line+"\n"}
    return out;
  }
  if(name.endsWith(".doc"))throw new Error("Tệp .doc đời cũ chưa đọc được. Hãy mở bằng Word rồi lưu lại thành .docx hoặc .pdf.");
  return await f.text();
}
function htmlToText(html){
  const d=document.createElement("div");d.innerHTML=window.DOMPurify?DOMPurify.sanitize(html):"";
  let out="",qn=0;
  const walk=(el,depth)=>{for(const node of el.childNodes){
    if(node.nodeType===3){out+=node.textContent;continue}
    if(node.nodeType!==1)continue;const tag=node.tagName;
    if(tag==="OL"||tag==="UL"){let k=0;for(const li of node.children){if(li.tagName!=="LI")continue;
        const prefix=tag==="UL"?"- ":depth===0?(++qn)+". ":(LET[k]||"-")+". ";k++;
        out+="\n"+prefix;walk(li,depth+1);out+="\n"}continue}
    if(tag==="BR"){out+="\n";continue}
    if(/^(P|H[1-6]|DIV|TR)$/.test(tag)){out+="\n";walk(node,depth);out+="\n";continue}
    if(tag==="TD"||tag==="TH"){walk(node,depth);out+="  ";continue}
    walk(node,depth)}};
  walk(d,0);
  return out.replace(/[ \t]+\n/g,"\n").replace(/\n{3,}/g,"\n\n").trim();
}

/* ---------- AI normalize ---------- */
function normalizeAI(v){
  const arr=Array.isArray(v)?v:(v&&Array.isArray(v.questions)?v.questions:[]);
  return arr.map(x=>{if(!x||typeof x!=="object")return null;
    const opts=(x.options||x.opts||x.choices||[]).map(o=>String(typeof o==="object"&&o?(o.text??""):o).replace(/^\s*[A-Ha-h][\.\)]\s+/,"").trim());
    let a=x.answer??x.answers??x.ans??x.correct;if(!Array.isArray(a))a=a==null||a===""?[]:[a];
    const ans=[...new Set(a.map(y=>typeof y==="number"?y:/^\d+$/.test(String(y))?+y:String(y).trim().toUpperCase().charCodeAt(0)-65).filter(i=>i>=0&&i<opts.length))];
    return {id:uid("q"),q:String(x.question||x.q||"").trim(),opts,ans,exp:String(x.explanation||x.exp||"").trim()}}).filter(q=>q&&q.q&&q.opts.length>=2);
}

function histRow(a,showTitle){

/* ---------- quiz runner ---------- */
function startRun(z,subset){
  const o=S.qo;const qs=validQs(z).map(q=>({id:q.id,q:q.q,opts:q.opts.slice(),ans:q.ans.slice(),exp:q.exp||""}));
  let order=qs.map((q,i)=>i);
  if(subset){order=order.filter(i=>subset.includes(qs[i].id));if(o.shuffle)shuffle(order)}
  else{if(o.shuffle)shuffle(order);if(o.count!=="all"&&+o.count<order.length)order=order.slice(0,+o.count)}
  if(!order.length){toast("Không có câu hỏi để làm.");return}
  const optOrder={};qs.forEach(q=>{const ar=q.opts.map((_,j)=>j);const fixed=q.opts.some(t=>/tất cả|cả .{0,20} đều|all of the above|none of the above|không có đáp án|both/i.test(t));if(o.shuffleOpts&&!fixed)shuffle(ar);optOrder[q.id]=ar});
  S.run={quizId:z.id,title:z.title||"Bộ đề",subject:subj(z),mode:o.mode,qs,order,optOrder,picks:{},checked:{},flags:{},i:0,start:Date.now(),limit:o.timed?order.length*72:null,phase:"take",retry:!!subset,filter:"all"};
  closeDrawer();$("#app").dataset.screen="note";
  startTimer();renderRun(true);
}
function stopRun(){stopTimer();S.run=null}
function startTimer(){stopTimer();S.timerI=setInterval(tick,1000)}
function stopTimer(){if(S.timerI){clearInterval(S.timerI);S.timerI=null}}
function tick(){const R=S.run;if(!R||R.phase!=="take"){stopTimer();return}
  const el=$("#timer");const used=(Date.now()-R.start)/1000;
  if(R.limit){const left=R.limit-used;if(el){el.textContent=dur(left);el.classList.toggle("low",left<=60)}if(left<=0){toast("Hết giờ! Bài đã được nộp tự động.");submitRun(true)}}

function expHtml(q){return q.exp?renderMd(q.exp):S.sample?`<button class="btn soft" data-ra="explain" data-q="${esc(q.id)}">${icon("spark")}Nhờ Claude giải thích</button>`:`<span style="color:var(--muted)">Câu này chưa có giải thích.</span>`}

function pickOpt(oi){
  const R=S.run;if(!R||R.phase!=="take")return;const q=curQ();
  if(R.mode==="practice"&&R.checked[q.id])return;
  let p=(R.picks[q.id]||[]).slice();
  if(q.ans.length>1){p=p.includes(oi)?p.filter(x=>x!==oi):[...p,oi]}
  else p=[oi];
  R.picks[q.id]=p;
  if(R.mode==="practice"&&q.ans.length===1)R.checked[q.id]=true;
  renderRun(false);
}
function goQ(k){const R=S.run;if(!R)return;const n=Math.max(0,Math.min(R.order.length-1,k));if(n===R.i)return;R.i=n;renderRun(true)}
async function submitRun(force){
  const R=S.run;if(!R||R.phase!=="take")return;
  const total=R.order.length,unans=R.order.filter(i=>!(R.picks[R.qs[i].id]||[]).length).length;
  if(!force&&unans&&!(await confirmBox("Nộp bài?",`Còn ${unans} câu chưa trả lời. Những câu này sẽ tính là sai.`,"Nộp bài",false,"Làm tiếp")))return;
  if(!force&&!unans&&R.mode==="exam"&&!(await confirmBox("Nộp bài?","Bạn đã trả lời tất cả câu hỏi. Nộp để xem kết quả nhé.","Nộp bài",false,"Xem lại")))return;
  if(S.run!==R||R.phase!=="take")return;
  stopTimer();
  const items=R.order.map(i=>{const q=R.qs[i],p=R.picks[q.id]||[];return {q:q.id,p,ok:p.length>0&&same(p,q.ans)}});
  const correct=items.filter(x=>x.ok).length,skipped=items.filter(x=>!x.p.length).length;
  const secs=Math.min(R.limit||Infinity,(Date.now()-R.start)/1000);
  R.result={items,correct,skipped,wrong:total-correct-skipped,total,pct:Math.round(correct/total*100),secs};
  R.phase="result";R.filter="all";
  renderRun(true);
  if(S.canWrite){const a={id:uid("a"),quizId:R.quizId,quizTitle:R.title,mode:R.mode,retry:R.retry,total,correct,pct:R.result.pct,secs:Math.round(secs),startedAt:R.start,finishedAt:Date.now(),items};
    if(await Store.put("attempts",a)){toast("Đã lưu kết quả");renderSide();renderList()}}
}
