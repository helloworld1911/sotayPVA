name = "sotaypva"
main = "src/worker.js"
compatibility_date = "2025-10-01"

# Trang web (index.html) nằm trong thư mục public
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Cơ sở dữ liệu D1. Đã điền mã database so-tay-db.
[[d1_databases]]
binding = "DB"
database_name = "so-tay-db"
database_id = "ddf28a7f-c415-4a75-b2fd-cc6541a04d25"

# Model Claude dùng cho các nút "Nhờ Claude" (chỉ chạy khi bạn đặt ANTHROPIC_API_KEY)
[vars]
AI_MODEL = "claude-sonnet-5-5"
